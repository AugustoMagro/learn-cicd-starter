name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Run local tests
        run: go test ./internals/auth/

      - name: Force Failure
        run: (exit 0)

